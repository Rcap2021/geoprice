[supervisord]
nodaemon=false
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[program:xvfb]
command=/usr/bin/Xvfb :1 -screen 0 1280x900x24 -ac
autorestart=true
priority=100
startsecs=1
stdout_logfile=/var/log/xvfb.log
stderr_logfile=/var/log/xvfb.log

[program:x11vnc]
command=/usr/bin/x11vnc -display :1 -forever -nopw -shared -rfbport 5900 -noxdamage -quiet
autorestart=true
priority=200
startsecs=2
stdout_logfile=/var/log/x11vnc.log
stderr_logfile=/var/log/x11vnc.log

[program:websockify]
command=/usr/bin/websockify --web /usr/share/novnc/ 6080 localhost:5900
autorestart=true
priority=300
startsecs=2
stdout_logfile=/var/log/websockify.log
stderr_logfile=/var/log/websockify.log

[program:chromium]
command=/usr/local/bin/start-chromium.sh
autorestart=false
priority=400
startsecs=3
environment=DISPLAY=":1"
stdout_logfile=/var/log/chromium.log
stderr_logfile=/var/log/chromium.log
