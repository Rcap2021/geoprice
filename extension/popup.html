<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f8f9ff;
      color: #1f2937;
    }

    /* ── Header ── */
    .header {
      background: linear-gradient(135deg, #6366f1, #7c3aed);
      padding: 13px 15px 11px;
      display: flex;
      align-items: center;
      gap: 9px;
    }
    .logo { font-size: 24px; line-height: 1; }
    .title-block { flex: 1; }
    .title { font-weight: 700; font-size: 14px; color: #fff; }
    .subtitle { font-size: 10px; color: rgba(255,255,255,.7); margin-top: 1px; }
    .version { font-size: 9px; color: rgba(255,255,255,.45); }

    /* ── Body ── */
    .body { padding: 12px 13px; }

    /* ── Country Picker ── */
    .picker-card {
      background: #fff;
      border: 1.5px solid #e5e7eb;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 10px;
    }
    .picker-card.connected {
      border-color: #6366f1;
      background: #eef2ff;
    }
    .picker-label {
      font-size: 10px;
      font-weight: 600;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: .04em;
      margin-bottom: 7px;
    }
    .picker-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .country-select {
      flex: 1;
      font-size: 12px;
      padding: 5px 7px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      background: #fff;
      color: #1f2937;
      outline: none;
      cursor: pointer;
    }
    .country-select:focus { border-color: #6366f1; }
    .btn-connect {
      font-size: 11px;
      font-weight: 600;
      padding: 5px 10px;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-connect:hover { background: #4f46e5; }
    .btn-connect:disabled { background: #a5b4fc; cursor: default; }
    .btn-disconnect {
      font-size: 11px;
      font-weight: 600;
      padding: 5px 10px;
      background: #fee2e2;
      color: #ef4444;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-disconnect:hover { background: #fecaca; }

    .connected-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 7px;
    }
    .connected-label {
      font-size: 11px;
      font-weight: 600;
      color: #4f46e5;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .ip-badge {
      font-size: 10px;
      color: #059669;
      font-weight: 600;
      margin-top: 4px;
    }
    .ip-badge.checking { color: #9ca3af; font-weight: 400; }
    .dot-green {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #10b981;
      animation: pulse 1.5s infinite;
      display: inline-block;
    }
    .check-ip-link {
      font-size: 10px;
      color: #6366f1;
      text-decoration: none;
      border-bottom: 1px dashed #a5b4fc;
    }
    .check-ip-link:hover { color: #4f46e5; }

    /* ── Idle state ── */
    .idle-msg {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 14px;
      text-align: center;
      color: #9ca3af;
      font-size: 12px;
    }
    .idle-msg .idle-icon { font-size: 22px; margin-bottom: 5px; }
    .idle-msg strong { display: block; color: #6b7280; font-size: 13px; margin-bottom: 2px; }

    /* ── Session list ── */
    .sessions-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 7px;
    }
    .sessions-label { font-size: 11px; font-weight: 600; color: #6b7280; text-transform: uppercase; letter-spacing: .04em; }
    .clear-all-btn {
      font-size: 10px;
      color: #ef4444;
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 4px;
    }
    .clear-all-btn:hover { background: #fee2e2; }

    .session-card {
      background: #fff;
      border: 1.5px solid #e5e7eb;
      border-radius: 10px;
      padding: 9px 11px;
      margin-bottom: 7px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .session-card.active { border-color: #6366f1; }

    .dot {
      flex-shrink: 0;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #d1d5db;
    }
    .dot-active { background: #10b981; animation: pulse 1.5s infinite; }
    .dot-idle   { background: #d1d5db; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

    .session-info { flex: 1; min-width: 0; }
    .session-geo { font-size: 13px; font-weight: 700; color: #1f2937; }
    .session-status { font-size: 10px; color: #9ca3af; margin-top: 1px; }
    .session-status.is-active { color: #6366f1; font-weight: 600; }

    .session-actions { display: flex; gap: 5px; }
    .btn-activate {
      font-size: 10px;
      padding: 3px 7px;
      background: #eef2ff;
      color: #6366f1;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: 600;
      white-space: nowrap;
    }
    .btn-activate:hover { background: #e0e7ff; }
    .btn-close {
      font-size: 12px;
      padding: 2px 5px;
      background: none;
      color: #9ca3af;
      border: none;
      cursor: pointer;
      border-radius: 4px;
      line-height: 1;
    }
    .btn-close:hover { background: #fee2e2; color: #ef4444; }

    /* ── Footer ── */
    .footer {
      margin-top: 8px;
      padding-top: 9px;
      border-top: 1px solid #e5e7eb;
      font-size: 10px;
      color: #9ca3af;
      display: flex;
      justify-content: space-between;
    }
    .footer a { color: #6366f1; text-decoration: none; }
    .footer a:hover { text-decoration: underline; }

    /* ── Notice banner ── */
    .notice {
      background: #fefce8;
      border: 1px solid #fde68a;
      border-radius: 7px;
      padding: 6px 9px;
      font-size: 10px;
      color: #92400e;
      margin-bottom: 9px;
      line-height: 1.4;
    }

    .divider {
      border: none;
      border-top: 1px solid #e5e7eb;
      margin: 10px 0;
    }
    .sessions-section-title {
      font-size: 10px;
      font-weight: 600;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: .04em;
      margin-bottom: 7px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🌍</div>
    <div class="title-block">
      <div class="title">GeoPrice Travel</div>
      <div class="subtitle">Geo-proxy hotel booking</div>
    </div>
    <div class="version" id="ext-version"></div>
  </div>

  <div class="body">

    <!-- ── Country Picker ── -->
    <div class="picker-card" id="picker-card">
      <div class="picker-label">Browse as country</div>
      <div class="picker-row">
        <select class="country-select" id="country-select">
          <option value="">Select country…</option>
          <option value="AE">🇦🇪 UAE</option>
          <option value="AT">🇦🇹 Austria</option>
          <option value="AU">🇦🇺 Australia</option>
          <option value="BD">🇧🇩 Bangladesh</option>
          <option value="CA">🇨🇦 Canada</option>
          <option value="CH">🇨🇭 Switzerland</option>
          <option value="CL">🇨🇱 Chile</option>
          <option value="DE">🇩🇪 Germany</option>
          <option value="ES">🇪🇸 Spain</option>
          <option value="FR">🇫🇷 France</option>
          <option value="GB">🇬🇧 United Kingdom</option>
          <option value="HK">🇭🇰 Hong Kong</option>
          <option value="HU">🇭🇺 Hungary</option>
          <option value="IE">🇮🇪 Ireland</option>
          <option value="IN">🇮🇳 India</option>
          <option value="IT">🇮🇹 Italy</option>
          <option value="JP">🇯🇵 Japan</option>
          <option value="KE">🇰🇪 Kenya</option>
          <option value="KR">🇰🇷 South Korea</option>
          <option value="KZ">🇰🇿 Kazakhstan</option>
          <option value="MX">🇲🇽 Mexico</option>
          <option value="MY">🇲🇾 Malaysia</option>
          <option value="NL">🇳🇱 Netherlands</option>
          <option value="NZ">🇳🇿 New Zealand</option>
          <option value="PK">🇵🇰 Pakistan</option>
          <option value="PL">🇵🇱 Poland</option>
          <option value="SG">🇸🇬 Singapore</option>
          <option value="US">🇺🇸 United States</option>
          <option value="VN">🇻🇳 Vietnam</option>
          <option value="ZA">🇿🇦 South Africa</option>
        </select>
        <button class="btn-connect" id="btn-connect" disabled>Connect</button>
      </div>
      <div id="connected-row" style="display:none" class="connected-row">
        <span class="connected-label">
          <span class="dot-green"></span>
          <span id="connected-label-text">Connected</span>
        </span>
        <button class="btn-disconnect" id="btn-disconnect">Disconnect</button>
      </div>
      <div id="ip-result" class="ip-badge" style="display:none"></div>
    </div>

    <hr class="divider">

    <!-- ── Deal sessions from Book Cheapest ── -->
    <div class="idle-msg" id="idle-state">
      <div class="idle-icon">🛎️</div>
      <strong>No active deal sessions</strong>
      Click "Book via Extension" on a deal to open geo-proxied Booking.com.
    </div>

    <div id="active-state" style="display:none">
      <div id="multi-proxy-notice" class="notice" style="display:none">
        ⚠️ Multiple tabs open. Chrome uses <strong>one proxy at a time</strong>. Click "Make Active" to switch.
      </div>
      <div class="sessions-header">
        <span class="sessions-label">Deal sessions</span>
        <button class="clear-all-btn" id="clear-all-btn">Clear all</button>
      </div>
      <div id="sessions-list"></div>
    </div>

    <div class="footer">
      <a href="https://hotels.chatleg.ai" target="_blank">hotels.chatleg.ai</a>
      <span id="ext-version-footer"></span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
