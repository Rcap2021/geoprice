<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f8f9ff;
      padding: 16px;
      color: #1f2937;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .logo {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #6366f1, #7c3aed);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    .title { font-weight: 700; font-size: 15px; color: #1f2937; }
    .subtitle { font-size: 11px; color: #6b7280; }
    .status-box {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 12px;
    }
    .status-label { font-size: 11px; color: #6b7280; margin-bottom: 4px; }
    .status-value {
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .dot-idle { background: #d1d5db; }
    .dot-active { background: #10b981; animation: pulse 1.5s infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .clear-btn {
      width: 100%;
      padding: 9px;
      background: #ef4444;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .clear-btn:hover { background: #dc2626; }
    .clear-btn:disabled { background: #d1d5db; cursor: default; }
    .footer {
      margin-top: 12px;
      font-size: 10px;
      color: #9ca3af;
      text-align: center;
    }
    .footer a { color: #6366f1; text-decoration: none; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🌍</div>
    <div>
      <div class="title">GeoPrice Travel</div>
      <div class="subtitle">Geo-proxy booking</div>
    </div>
  </div>

  <div class="status-box">
    <div class="status-label">Proxy status</div>
    <div class="status-value" id="status-value">
      <span class="dot dot-idle" id="status-dot"></span>
      <span id="status-text">Idle</span>
    </div>
  </div>

  <button class="clear-btn" id="clear-btn" disabled>Clear Proxy</button>

  <div class="footer">
    <a href="https://hotels.chatleg.ai" target="_blank">hotels.chatleg.ai</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
