<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoPrice Travel - Find the Best Hotel Deals Worldwide</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .chat-gradient { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .typing-dot { animation: typing 1.4s infinite; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-5px); }
        }
        .deal-card:hover { transform: translateY(-2px); }
        .progress-bar { transition: width 0.5s ease-out; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Use relative URLs — works regardless of which server/IP hosts the app
        const API_BASE = '';
        const WS_PROTOCOL = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const WS_HOST = window.location.host;

        // All 32 supported country flags
        const COUNTRY_FLAGS = {
            'BR': '🇧🇷', 'IN': '🇮🇳', 'AR': '🇦🇷', 'TR': '🇹🇷',
            'ID': '🇮🇩', 'TH': '🇹🇭', 'PL': '🇵🇱', 'MX': '🇲🇽',
            'ZA': '🇿🇦', 'PT': '🇵🇹', 'US': '🇺🇸', 'GB': '🇬🇧',
            'VN': '🇻🇳', 'MY': '🇲🇾', 'BD': '🇧🇩', 'PK': '🇵🇰',
            'BG': '🇧🇬', 'SK': '🇸🇰', 'RS': '🇷🇸', 'HU': '🇭🇺',
            'KZ': '🇰🇿', 'NG': '🇳🇬', 'MA': '🇲🇦', 'TN': '🇹🇳',
            'PE': '🇵🇪', 'CL': '🇨🇱', 'JP': '🇯🇵', 'KR': '🇰🇷',
            'SG': '🇸🇬', 'HK': '🇭🇰', 'FR': '🇫🇷', 'CA': '🇨🇦',
        };

        // ============== Components ==============

        function ChatMessage({ message, isUser }) {
            return (
                <div className={`flex ${isUser ? 'justify-end' : 'justify-start'} mb-4`}>
                    <div className={`max-w-[80%] rounded-2xl px-4 py-3 ${
                        isUser
                            ? 'bg-indigo-600 text-white rounded-br-md'
                            : 'bg-white text-gray-800 shadow-sm border border-gray-100 rounded-bl-md'
                    }`}>
                        <p className="text-sm leading-relaxed whitespace-pre-wrap">{message.content}</p>
                        <p className={`text-xs mt-1 ${isUser ? 'text-indigo-200' : 'text-gray-400'}`}>
                            {new Date(message.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
                        </p>
                    </div>
                </div>
            );
        }

        function TypingIndicator() {
            return (
                <div className="flex justify-start mb-4">
                    <div className="bg-white rounded-2xl rounded-bl-md px-4 py-3 shadow-sm border border-gray-100">
                        <div className="flex space-x-1">
                            <div className="w-2 h-2 bg-gray-400 rounded-full typing-dot"></div>
                            <div className="w-2 h-2 bg-gray-400 rounded-full typing-dot"></div>
                            <div className="w-2 h-2 bg-gray-400 rounded-full typing-dot"></div>
                        </div>
                    </div>
                </div>
            );
        }

        function IntentCard({ intent }) {
            if (!intent.destination_city) return null;
            const fmt = (d) => d ? new Date(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '---';
            return (
                <div className="bg-gradient-to-r from-indigo-500 to-purple-600 rounded-xl p-4 text-white mb-4 shadow-lg">
                    <h3 className="font-semibold mb-2 flex items-center">
                        <svg className="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                        Your Trip
                    </h3>
                    <div className="grid grid-cols-2 gap-2 text-sm">
                        <div><span className="text-indigo-200">Destination:</span><p className="font-medium">{intent.destination_city}</p></div>
                        <div><span className="text-indigo-200">Hotel Type:</span><p className="font-medium capitalize">{intent.hotel_tier || '---'}</p></div>
                        <div><span className="text-indigo-200">Check-in:</span><p className="font-medium">{fmt(intent.check_in)}</p></div>
                        <div><span className="text-indigo-200">Check-out:</span><p className="font-medium">{fmt(intent.check_out)}</p></div>
                        <div><span className="text-indigo-200">Guests:</span><p className="font-medium">{intent.guests}</p></div>
                        <div><span className="text-indigo-200">Rooms:</span><p className="font-medium">{intent.rooms}</p></div>
                    </div>
                </div>
            );
        }

        function SearchProgress({ searchId, onComplete, onDone }) {
            const [status, setStatus] = useState('connecting');
            const [progress, setProgress] = useState(0);
            const [geosCompleted, setGeosCompleted] = useState([]);
            const [geosTotal, setGeosTotal] = useState(32);
            const [liveDeals, setLiveDeals] = useState(0);

            useEffect(() => {
                if (!searchId) return;
                const ws = new WebSocket(`${WS_PROTOCOL}//${WS_HOST}/api/search/${searchId}/stream`);
                ws.onopen = () => setStatus('searching');
                ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    setProgress(data.progress || 0);
                    setGeosCompleted(data.geos_completed || []);
                    setGeosTotal(data.geos_total || 32);
                    if (data.best_deals && data.best_deals.length > 0) {
                        setLiveDeals(data.best_deals.length);
                        onComplete(data.best_deals);  // stream deals live
                    }
                    if (data.completed || data.status === 'completed') {
                        setStatus('completed');
                        if (onDone) onDone();
                        ws.close();
                    }
                };
                ws.onerror = () => {
                    setStatus('polling');
                    const interval = setInterval(async () => {
                        try {
                            const res = await fetch(`${API_BASE}/api/search/${searchId}`);
                            const data = await res.json();
                            setProgress(data.progress || 0);
                            setGeosCompleted(data.geos_completed || []);
                            if (data.best_deals && data.best_deals.length > 0) {
                                onComplete(data.best_deals);
                            }
                            if (data.status === 'completed') {
                                clearInterval(interval);
                                setStatus('completed');
                                if (onDone) onDone();
                            }
                        } catch (e) { console.error(e); }
                    }, 2000);
                };
                return () => ws.close();
            }, [searchId]);

            return (
                <div className="bg-white rounded-xl p-6 shadow-sm border border-gray-100 mb-4">
                    <div className="flex items-center justify-between mb-3">
                        <h3 className="font-semibold text-gray-800 text-sm">
                            {status === 'searching' || status === 'polling' ? '🔍 Searching worldwide...' :
                             status === 'completed' ? '✅ Search complete!' : '⏳ Connecting...'}
                        </h3>
                        <span className="text-sm font-semibold text-indigo-600">{progress}%</span>
                    </div>
                    <div className="w-full bg-gray-200 rounded-full h-2 mb-4">
                        <div className="bg-gradient-to-r from-indigo-500 to-purple-600 h-2 rounded-full progress-bar" style={{ width: `${progress}%` }}></div>
                    </div>
                    <div className="flex flex-wrap gap-1.5">
                        {Object.keys(COUNTRY_FLAGS).map(geo => (
                            <span key={geo} className={`text-base transition-all ${geosCompleted.includes(geo) ? 'opacity-100' : 'opacity-20 grayscale'}`} title={geo}>
                                {COUNTRY_FLAGS[geo]}
                            </span>
                        ))}
                    </div>
                </div>
            );
        }

        // Deal Card — shows cheapest-geo button + US comparison button
        function DealCard({ deal, rank }) {
            const [browseLoading, setBrowseLoading] = React.useState(false);
            const stars = deal.stars ? '★'.repeat(deal.stars) : '';
            const flag = COUNTRY_FLAGS[deal.geo_country] || '🌍';
            const baseFlag = COUNTRY_FLAGS[deal.baseline_geo || 'US'] || '🇺🇸';
            const savingsPct = deal.savings_percent || 0;
            const badgeColor = savingsPct >= 20 ? 'bg-green-500' : savingsPct >= 10 ? 'bg-emerald-400' : 'bg-teal-400';

            const handleBookCheapest = async () => {
                setBrowseLoading(true);
                // Open window synchronously during the user gesture — mobile browsers
                // block window.open() called after an await (not seen as user-initiated)
                const newTab = window.open('', '_blank');
                if (newTab) {
                    newTab.document.write(
                        `<html><body style="font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;background:#f5f7ff">` +
                        `<p style="color:#4f46e5;font-size:1.1rem">Opening ${deal.geo_country_name || deal.geo_country} browser, please wait…</p>` +
                        `</body></html>`
                    );
                }
                try {
                    const res = await fetch(`${API_BASE}/api/browse`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ url: deal.booking_url, country: deal.geo_country })
                    });
                    if (!res.ok) {
                        const err = await res.json();
                        if (newTab) newTab.close();
                        alert(`Could not open browser: ${err.detail || 'Unknown error'}`);
                        return;
                    }
                    const data = await res.json();
                    if (newTab) {
                        newTab.location.href = data.session_url;
                    } else {
                        window.open(data.session_url, '_blank');
                    }
                } catch (e) {
                    if (newTab) newTab.close();
                    alert('Connection error. Please try again.');
                } finally {
                    setBrowseLoading(false);
                }
            };

            return (
                <div className="bg-white rounded-xl shadow-sm border border-gray-100 deal-card transition-all hover:shadow-md overflow-hidden">
                    {/* Top row: rank + name + savings badge */}
                    <div className="flex items-start gap-3 p-4 pb-2">
                        <div className="flex-shrink-0 w-7 h-7 rounded-full bg-indigo-100 text-indigo-700 text-xs font-bold flex items-center justify-center mt-0.5">
                            {rank}
                        </div>
                        <div className="flex-1 min-w-0">
                            <h4 className="font-semibold text-gray-800 text-sm leading-tight truncate">{deal.hotel_name}</h4>
                            <p className="text-xs text-gray-400 mt-0.5 truncate">{deal.location}</p>
                            {stars && <p className="text-yellow-400 text-xs mt-0.5">{stars}</p>}
                        </div>
                        <div className={`flex-shrink-0 ${badgeColor} text-white px-2.5 py-1 rounded-full text-xs font-bold`}>
                            Save {savingsPct}%
                        </div>
                    </div>

                    {/* Price comparison row */}
                    <div className="px-4 py-3 bg-gray-50 flex items-center gap-4">
                        {/* Cheapest price */}
                        <div className="flex-1">
                            <p className="text-xs text-gray-400 mb-0.5">Best price {flag} {deal.geo_country_name}</p>
                            <p className="text-xl font-bold text-gray-900">${deal.usd_price?.toLocaleString()}</p>
                            <p className="text-xs text-gray-400">{deal.geo_currency} {deal.geo_price?.toLocaleString()}</p>
                        </div>
                        {/* Arrow */}
                        <div className="text-gray-300 text-lg">vs</div>
                        {/* Baseline price */}
                        <div className="flex-1 text-right">
                            <p className="text-xs text-gray-400 mb-0.5">{baseFlag} {deal.baseline_geo_name || 'US'} price</p>
                            <p className="text-xl font-bold text-gray-400 line-through">${deal.baseline_usd_price?.toLocaleString()}</p>
                            <p className="text-xs text-green-600 font-medium">Save ${deal.savings_usd?.toLocaleString()}</p>
                        </div>
                    </div>

                    {/* Badges row */}
                    {(deal.free_cancellation || deal.includes_breakfast || deal.review_score) && (
                        <div className="flex gap-2 px-4 py-2 flex-wrap">
                            {deal.free_cancellation && <span className="text-xs bg-blue-50 text-blue-700 px-2 py-0.5 rounded-full">Free cancellation</span>}
                            {deal.includes_breakfast && <span className="text-xs bg-orange-50 text-orange-700 px-2 py-0.5 rounded-full">Breakfast included</span>}
                            {deal.review_score && <span className="text-xs bg-yellow-50 text-yellow-700 px-2 py-0.5 rounded-full">⭐ {deal.review_score}</span>}
                        </div>
                    )}

                    {/* Two booking buttons */}
                    <div className="flex gap-2 px-4 pb-4 pt-2">
                        <button
                            onClick={handleBookCheapest}
                            disabled={browseLoading}
                            className="flex-1 text-center bg-indigo-600 hover:bg-indigo-700 disabled:bg-indigo-400 text-white px-3 py-2 rounded-lg text-xs font-semibold transition-colors cursor-pointer"
                        >
                            {browseLoading
                                ? `Opening ${deal.geo_country_name || deal.geo_country} browser...`
                                : `${flag} Book Cheapest (${deal.geo_country})`
                            }
                        </button>
                        {deal.baseline_url ? (
                            <a
                                href={deal.baseline_url}
                                target="_blank"
                                rel="noopener noreferrer"
                                className="flex-1 text-center bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-2 rounded-lg text-xs font-semibold transition-colors"
                            >
                                {baseFlag} Compare {deal.baseline_geo || 'US'} Price
                            </a>
                        ) : (
                            <a
                                href={`https://www.booking.com/search.html?ss=${encodeURIComponent(deal.hotel_name)}`}
                                target="_blank"
                                rel="noopener noreferrer"
                                className="flex-1 text-center bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-2 rounded-lg text-xs font-semibold transition-colors"
                            >
                                Search on Booking.com
                            </a>
                        )}
                    </div>
                </div>
            );
        }

        function ResultsPanel({ deals, searching }) {
            if (!deals || deals.length === 0) {
                return <div className="text-center py-8 text-gray-400 text-sm">No deals yet — start a search!</div>;
            }
            const best = deals[0];
            const avgSavings = (deals.reduce((s, d) => s + (d.savings_percent || 0), 0) / deals.length).toFixed(1);
            return (
                <div>
                    <div className="bg-gradient-to-r from-green-500 to-emerald-600 rounded-xl p-4 text-white mb-4">
                        <div className="flex items-center justify-between mb-2">
                            <h3 className="font-semibold text-sm">💰 Savings Summary</h3>
                            {searching && <span className="text-xs text-green-100 animate-pulse">⏳ More coming...</span>}
                        </div>
                        <div className="grid grid-cols-3 gap-2 text-center">
                            <div>
                                <p className="text-green-100 text-xs">Deals Found</p>
                                <p className="text-2xl font-bold">{deals.length}</p>
                            </div>
                            <div>
                                <p className="text-green-100 text-xs">Best Save</p>
                                <p className="text-2xl font-bold">{best.savings_percent}%</p>
                            </div>
                            <div>
                                <p className="text-green-100 text-xs">Avg Save</p>
                                <p className="text-2xl font-bold">{avgSavings}%</p>
                            </div>
                        </div>
                    </div>
                    <div className="space-y-3 max-h-[600px] overflow-y-auto pr-1">
                        {deals.map((deal, idx) => (
                            <DealCard key={deal.hotel_id || idx} deal={deal} rank={idx + 1} />
                        ))}
                    </div>
                </div>
            );
        }

        function QuickReplies({ onSelect }) {
            const suggestions = ["Hotels in Paris", "Beach resort in Bali", "Tokyo next month", "Budget hotels NYC", "Luxury resort Maldives"];
            return (
                <div className="flex flex-wrap gap-2 mb-3">
                    {suggestions.map((t, i) => (
                        <button key={i} onClick={() => onSelect(t)}
                            className="px-3 py-1.5 bg-white border border-gray-200 rounded-full text-xs text-gray-600 hover:bg-gray-50 hover:border-indigo-300 transition-colors">
                            {t}
                        </button>
                    ))}
                </div>
            );
        }

        function App() {
            const [messages, setMessages] = useState([{
                role: 'assistant',
                content: "Hey! 👋 I'm GeoPrice — I check hotel prices across 32 countries simultaneously to find you the biggest savings. Where would you like to go?",
                timestamp: new Date().toISOString()
            }]);
            const [input, setInput] = useState('');
            const [loading, setLoading] = useState(false);
            const [conversationId, setConversationId] = useState(null);
            const [intent, setIntent] = useState({});
            const [searchId, setSearchId] = useState(null);
            const [deals, setDeals] = useState([]);
            const [searching, setSearching] = useState(false);
            const [userCountry, setUserCountry] = useState('US');
            const messagesEndRef = useRef(null);

            useEffect(() => { messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [messages]);

            // Auto-detect user's country from IP for baseline comparison
            // Only use the detected country if it's one of our 32 supported geos; otherwise keep US
            useEffect(() => {
                fetch('https://ipapi.co/json/')
                    .then(r => r.json())
                    .then(data => {
                        if (data.country_code && COUNTRY_FLAGS[data.country_code]) {
                            setUserCountry(data.country_code);
                        }
                    })
                    .catch(() => { /* silent fail — keep default US */ });
            }, []);

            const sendMessage = async (text) => {
                if (!text.trim()) return;
                const userMsg = { role: 'user', content: text, timestamp: new Date().toISOString() };
                setMessages(prev => [...prev, userMsg]);
                setInput('');
                setLoading(true);
                try {
                    const res = await fetch(`${API_BASE}/api/chat`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ conversation_id: conversationId, message: text, baseline_geo: userCountry })
                    });
                    const data = await res.json();
                    setConversationId(data.conversation_id);
                    setIntent(data.intent || {});
                    setMessages(prev => [...prev, { role: 'assistant', content: data.response, timestamp: new Date().toISOString() }]);
                    if (data.search_triggered && data.search_id) {
                        setSearchId(data.search_id);
                        setDeals([]);
                        setSearching(true);
                    }
                } catch (e) {
                    setMessages(prev => [...prev, { role: 'assistant', content: "Sorry, connection error. Please try again.", timestamp: new Date().toISOString() }]);
                }
                setLoading(false);
            };

            const newSearch = () => {
                setMessages([{ role: 'assistant', content: "Hey! 👋 Where would you like to go next?", timestamp: new Date().toISOString() }]);
                setConversationId(null); setIntent({}); setSearchId(null); setDeals([]); setSearching(false);
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-indigo-50 via-white to-purple-50">
                    <header className="bg-white border-b border-gray-100 sticky top-0 z-10">
                        <div className="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
                            <div className="flex items-center space-x-2">
                                <div className="w-9 h-9 bg-gradient-to-r from-indigo-600 to-purple-600 rounded-xl flex items-center justify-center">
                                    <span className="text-white text-lg">🌍</span>
                                </div>
                                <div>
                                    <h1 className="font-bold text-gray-800 text-sm">GeoPrice Travel</h1>
                                    <p className="text-xs text-gray-400">Best hotel prices across 32 countries</p>
                                </div>
                            </div>
                            <button onClick={newSearch} className="text-xs text-indigo-600 hover:text-indigo-800 font-medium border border-indigo-200 px-3 py-1.5 rounded-lg hover:bg-indigo-50 transition-colors">
                                + New Search
                            </button>
                        </div>
                    </header>

                    <div className="max-w-6xl mx-auto px-4 py-6">
                        <div className="grid grid-cols-1 lg:grid-cols-5 gap-6">
                            {/* Chat panel — 2 cols */}
                            <div className="lg:col-span-2">
                                <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden flex flex-col" style={{ height: '80vh' }}>
                                    <div className="flex-1 overflow-y-auto p-4 bg-gray-50">
                                        {messages.map((msg, i) => <ChatMessage key={i} message={msg} isUser={msg.role === 'user'} />)}
                                        {loading && <TypingIndicator />}
                                        <div ref={messagesEndRef} />
                                    </div>
                                    {messages.length === 1 && (
                                        <div className="px-4 pt-2 bg-gray-50 border-t border-gray-100">
                                            <QuickReplies onSelect={sendMessage} />
                                        </div>
                                    )}
                                    <div className="p-3 border-t border-gray-100 bg-white">
                                        <div className="flex gap-2">
                                            <input
                                                value={input}
                                                onChange={e => setInput(e.target.value)}
                                                onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(input); } }}
                                                placeholder="Where would you like to go?"
                                                className="flex-1 px-3 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                                disabled={loading}
                                            />
                                            <button
                                                onClick={() => sendMessage(input)}
                                                disabled={loading || !input.trim()}
                                                className="px-4 py-2.5 bg-indigo-600 text-white rounded-xl text-sm font-medium hover:bg-indigo-700 disabled:opacity-40 transition-colors"
                                            >
                                                Send
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* Results panel — 3 cols */}
                            <div className="lg:col-span-3 space-y-4 overflow-y-auto" style={{ maxHeight: '80vh' }}>
                                <IntentCard intent={intent} />
                                {searchId && <SearchProgress searchId={searchId} onComplete={setDeals} onDone={() => setSearching(false)} />}
                                {deals.length > 0 && <ResultsPanel deals={deals} searching={searching} />}
                                {!searchId && deals.length === 0 && (
                                    <div className="bg-white rounded-2xl p-8 text-center border border-gray-100 shadow-sm">
                                        <div className="text-4xl mb-3">🔍</div>
                                        <h3 className="font-semibold text-gray-700 mb-2">How it works</h3>
                                        <p className="text-sm text-gray-500 mb-4">Tell me your destination and travel dates. I'll check Booking.com prices from 32 countries and show you where the same hotel is cheapest.</p>
                                        <div className="grid grid-cols-3 gap-3 text-xs text-gray-500">
                                            <div className="bg-indigo-50 rounded-lg p-3">
                                                <div className="text-2xl mb-1">💬</div>
                                                <p className="font-medium text-gray-700">Chat</p>
                                                <p>Tell me where & when</p>
                                            </div>
                                            <div className="bg-purple-50 rounded-lg p-3">
                                                <div className="text-2xl mb-1">🌍</div>
                                                <p className="font-medium text-gray-700">Search</p>
                                                <p>32 countries checked</p>
                                            </div>
                                            <div className="bg-green-50 rounded-lg p-3">
